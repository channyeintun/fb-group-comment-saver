<!doctype html>
<!--
  FIXTURE post-dialog.html: a Facebook group post opened as a modal [role=dialog] over the group
  feed, reproducing the DOM facts of SPEC §1 (English UI). Self-contained (inline CSS/JS, data: URIs).

  Served at https://www.facebook.com/groups/<slug>/posts/<postId>/ (or loaded with setContent).
    postId : from location.pathname /posts/<id>/, fallback 1001.  slug: fallback "testgroup".
    ids    : for post 1001 comment ids are exactly the numbers below; for any other post P they are
             prefixed with "<digits of P>0" (post 1002: 2001 -> 100202001) so ids stay unique.
    ?variant=minus1 : top-level comment C5 (2005, "Zaw Min Oo") is omitted (tests "missing" marking).
    ?variant=nohref : comment timestamp links have no href (no permalink anywhere; the date stays in
                      their aria-label). Each comment article carries a fake React fiber chain whose
                      memoizedProps.comment (3 levels up) is {legacy_fbid: <own id>,
                      id: btoa('comment:<postId>_<own id>'), author: {id: <uid>, name}}, readable from
                      the MAIN world only (like Facebook's). Variants are comma-separated; the e2e
                      harness can also set window.FBCS_FIXTURE_VARIANT before this script runs.
    ?variant=hash   : links Facebook has not filled in render as href="#" instead of no href: the
                      dialog post's header links (avatar, group, author, date) and, with nohref, the
                      comment timestamp links. a.href of "#" is the page URL — never a permalink.
    ?variant=arialabel : the dialog's post article (and the feed post behind it) carry an aria-label
                      ("<author>'s post") like comments do; they still own data-ad-rendering-role parts.
    Timing / behaviour variants (query params, combinable; used by tests/browser/driver.test.mjs):
    ?loadMs=<ms>        every loader (expanders, lazy load, sort) takes <ms> instead of 300 ms
    ?keepLabel=1        expanders keep their label while loading, with a progressbar after them
                        (instead of being replaced by the spinner)
    ?duds=<n>           n extra "View 1 reply" buttons (under C2, C3, C5, C6) that load nothing
                        (Facebook counts a reply that was deleted); every other thread still expands
    ?dialogDelay=<ms>   the dialog mounts <ms> after load; until then only the feed behind is shown
                        (a post URL loaded directly), and its [role=main] must not be taken for the post
    ?feedbackDelay=<ms> the post's counts row and sort control render <ms> after load
    ?bodyLink=<id>      the post body contains a pasted link to another group post /posts/<id>/
    ?commentLinks=<post>_<comment>  comment C2 links another post's comment
                        (/posts/<post>/?comment_id=<comment>) twice: pasted in its body, and as a
                        link-preview card after the body. Neither is C2's permalink.
    The dialog's "Close" button removes the dialog and goes back to the group feed with
    history.pushState (Facebook's SPA close).

  Comments (DOM pre-order once fully expanded; replies are FLAT siblings after their parent):
    C1  2001 Thura Min Oo      2 paragraphs, "5 reactions; see who reacted to this"
      R1  3001 Aye Chan Moe      reply to C1, "1 reaction; see who reacted to this"
      R2  3002 Min Thu           reply to C1, Myanmar text
        R3  3003 Thura Min Oo  reply to R2's reply (comment_id=2001, reply_comment_id=3003)
    C2  2002 Chai_lover🍵      emoji <img alt> in author name and body
    S1  2011 LuckyPanda7781      only after sort "All comments"
    C3  2003 Su Su Hlaing        truncated, "See more" expands to 2 paragraphs
    C4  2004 Ei Mon Kyaw         200x150 image attachment
      R4  3004 Kyaw Zin Thant    reply to C4
      R5  3005 Chai_lover🍵    reply to C4, emoji in body
    C5  2005 Zaw Min Oo          (absent with ?variant=minus1)
    S2  2012 Crypto Deals Official   only after sort "All comments"
    C6  2006 Thiri Aung          after "View more comments"
    C7  2007 Nay Lin             after "View more comments"; l.facebook.com link (inline + preview card)
    C8  2008 Hnin Wai            after "View more comments"
    C9  2009 Phyo Wai            lazy-loaded when the dialog's inner scroller reaches the bottom
    C10 2010 Khin Myat           lazy-loaded; sticker only (120x120 image, empty text)

  EXPECTED TOTALS (dialog only; the feed preview comment by "Feed Preview Person" (2999) that sits
  in [role=main] behind the dialog must never be extracted):
    initial (sort "Most relevant") : 5 comment articles (C1..C5)          minus1: 4
    + sort "All comments"          : +2 top-level (S1, S2)                 -> 7   (minus1: 6)
    + "View more comments"         : +3 top-level (C6..C8)
    + lazy load on scroll          : +2 top-level (C9, C10)
    + "View 2 replies" under C1    : +2 replies (R1, R2) and a nested "View 1 reply" after R2
    + "View 1 reply"               : +1 reply-to-reply (R3)
    + "View 2 replies" under C4    : +2 replies (R4, R5) and a "Hide replies" button (never click)
    FULLY EXPANDED : 17 = 12 top-level + 4 replies (depth 1) + 1 reply-to-reply (depth 2)
                     minus1: 16 = 11 top-level + 5 replies
    "Leave a comment" count button: "12".  Initial expanders: 3.  Initial "See more": 2 (post + C3).
    Indentation (margin-left): depth 0 = 16px, depth 1 = 77px, depth 2 = 119px inside the scroller.
    All loaders resolve after 300 ms (?loadMs) and show a [role=progressbar] while loading.
-->

  // ---- URL-derived identity -----------------------------------------------------------------

  var POST_URL = ORIGIN + '/groups/' + SLUG + '/posts/' + POST_ID + '/';

  function cid(n) { return ID_PREFIX + n; }
  function userUrl(uid) { return ORIGIN + '/groups/' + SLUG + '/user/' + uid + '/?' + TRACK; }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function svgData(w, h, fill) {
    return 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '"><rect width="100%" height="100%" fill="' + fill + '"/></svg>');
  }
  var EMOJI_SRC = svgData(16, 16, '#f7b928');
  var LIKE_SRC = svgData(16, 16, '#0866ff');
  var LOVE_SRC = svgData(16, 16, '#f33e58');

  function E(alt) { return '<img alt="' + alt + '" width="16" height="16" class="emoji" src="' + EMOJI_SRC + '">'; }
  function P(html) { return '<div dir="auto">' + html + '</div>'; }
  var SEE_MORE = '<div role="button" tabindex="0" class="see-more">See more</div>';

  var ROADMAP_INLINE = 'https://l.facebook.com/l.php?u=' + encodeURIComponent('https://roadmap.sh/') + '&h=AT0inlineXYZ';

  // ---- Comment data ---------------------------------------------------------------------------

  var DATA = {

          extra: '<div class="sticker"><img width="120" height="120" alt="Thumbs up sticker" src="' + svgData(120, 120, '#ffd54f') + '"></div>' },
    // Lives in the feed preview BEHIND the dialog.
    F1: { n: 2999, name: 'Feed Preview Person', uid: 100199, ago: '1 hour ago', aria: 'Wednesday 14 October 2026 at 00:10', t: '1h',
          body: P('This preview comment belongs to the feed behind the dialog.') }
  };

  function depthOf(key) { var c = DATA[key]; return c.parent ? depthOf(c.parent) + 1 : 0; }
  function threadRoot(key) { var c = DATA[key]; return c.parent ? threadRoot(c.parent) : key; }
  function childrenOf(key) { return Object.keys(DATA).filter(function (k) { return DATA[k].parent === key; }); }

  function ariaLabelOf(key) {
    var c = DATA[key];
    if (!c.parent) return 'Comment by ' + c.name + ' ' + c.ago;
    var p = DATA[c.parent];
    return 'Reply by ' + c.name + ' to ' + p.name + "'s " + (p.parent ? 'reply' : 'comment') + ' ' + c.ago;
  }

  function commentHref(key) {
    var c = DATA[key];
    var href = POST_URL + '?comment_id=' + cid(DATA[threadRoot(key)].n);
    if (c.parent) href += '&reply_comment_id=' + cid(c.n);
    return href + '&' + TRACK;
  }

  function reactionsHtml(count) {
    var label = count === 1 ? '1 reaction; see who reacted to this' : count + ' reactions; see who reacted to this';
    return '<div role="button" tabindex="0" aria-label="' + label + '" class="reactions">' +
      '<img alt="" width="16" height="16" src="' + LIKE_SRC + '"><img alt="" width="16" height="16" src="' + LOVE_SRC + '">' +
      '<span>' + count + '</span></div>';
  }

  /** One flat comment/reply article, mirroring the observed structure (SPEC §1). */
  function commentEl(key) {
    var c = DATA[key];
    var art = document.createElement('div');
    art.setAttribute('role', 'article');
    art.setAttribute('aria-label', ariaLabelOf(key));
    art.setAttribute('tabindex', '-1');
    art.className = 'cmt depth' + depthOf(key);
    var user = esc(userUrl(c.uid));
    var body = c.body;
    var extra = c.extra || '';
    if (COMMENT_LINKS && key === 'C2') {
      var other = ORIGIN + '/groups/' + SLUG + '/posts/' + COMMENT_LINKS[1] + '/?comment_id=' + COMMENT_LINKS[2];
      body += P('Same question here: <a role="link" tabindex="0" href="' + esc(other + '&' + TRACK) + '">' + esc(other) + '</a>');
      extra = '<a role="link" tabindex="0" class="link-card" href="' + esc(other + '&' + TRACK) + '">' +
        '<div class="lc-img"></div><div class="lc-text"><span>FACEBOOK.COM</span><span>Another comment</span></div></a>' + extra;
    }
    var timeHref = NOHREF && key !== 'F1' ? (HASH ? ' href="#"' : '') : ' href="' + esc(commentHref(key)) + '"';
    art.innerHTML =
      '<a role="link" tabindex="-1" class="avatar32" href="' + user + '"><svg width="32" height="32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#bcc0c4"/></svg></a>' +
      '<div class="cmt-main">' +
        '<div class="bubble">' +
          '<a role="link" tabindex="0" class="author" href="' + user + '"><span dir="auto">' + (c.nameHtml || c.name) + '</span></a>' +
          '<span aria-hidden="true"> · </span>' +
          '<a role="link" tabindex="0" class="time" aria-label="' + esc(c.aria) + '"' + timeHref + '><span dir="auto">' + c.t + '</span></a>' +
          (body ? '<span dir="auto" class="text">' + body + '</span>' : '') +
        '</div>' +
        extra +
        '<div class="cmt-actions">' +
          '<div role="button" tabindex="0" aria-label="Hide or report this"><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="2"/></svg></div>' +
          '<div role="button" tabindex="0" aria-label="Like">Like</div>' +
          '<div role="button" tabindex="0" aria-label="React"><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="5"/></svg></div>' +
          '<div role="button" tabindex="0">Reply</div>' +
          '<div role="button" tabindex="0">Share</div>' +
          (c.reactions ? reactionsHtml(c.reactions) : '') +
        '</div>' +
      '</div>';
    if (NOHREF && key !== 'F1') {
      // Fake React fiber (MAIN world expando), as on Facebook: the comment props sit a few levels up.
      art['__reactFiber$test'] = {
        memoizedProps: { role: 'article' },
        return: {
          memoizedProps: { depth: depthOf(key) },
          return: {
            memoizedProps: {
              comment: {
                legacy_fbid: cid(c.n),
                id: btoa('comment:' + POST_ID + '_' + cid(c.n)),
                author: { id: String(c.uid), name: c.name },
                preferred_body: null
              }
            },
            return: null
          }
        }
      };
    }
    var seeMore = art.querySelector('.see-more');
    if (seeMore && c.full) {
      var body = art.querySelector('.text');
      seeMore.addEventListener('click', function () { body.innerHTML = c.full; });
    }
    return art;
  }

  function spinner() {
    var s = document.createElement('div');
    s.setAttribute('role', 'progressbar');
    s.setAttribute('aria-label', 'Loading...');
    s.className = 'spinner';
    return s;
  }

  /**
   * A "View …" button: replaced by a spinner on click, then (LOAD_MS later) by load()'s nodes.
   * With ?keepLabel=1 the button keeps its label while a spinner shows after it.
   */
  function expander(label, className, load) {
    var b = document.createElement('div');
    b.setAttribute('role', 'button');
    b.setAttribute('tabindex', '0');
    b.className = 'expander ' + className;
    var span = document.createElement('span');
    span.textContent = label;
    b.appendChild(span);
    var busy = false;
    b.addEventListener('click', function () {
      if (busy) return;
      busy = true;
      var spin = spinner();
      if (KEEP_LABEL) b.after(spin);
      else b.replaceWith(spin);
      setTimeout(function () {
        var nodes = load();
        if (KEEP_LABEL) {
          spin.remove();
          b.replaceWith.apply(b, nodes);
        } else {
          spin.replaceWith.apply(spin, nodes);
        }
      }, LOAD_MS);
    });
    return b;
  }

  /** "View 1 reply" for a reply that no longer exists: clicking it loads nothing. */
  function dudButton(key) {
    var b = document.createElement('div');
    b.setAttribute('role', 'button');
    b.setAttribute('tabindex', '0');
    b.className = 'expander depth' + depthOf(key);
    b.innerHTML = '<span>View 1 reply</span>';
    return b;
  }

  function repliesButton(key) {
    var kids = childrenOf(key);
    if (!kids.length) return null;
    var label = kids.length === 1 ? 'View 1 reply' : 'View ' + kids.length + ' replies';
    return expander(label, 'depth' + depthOf(key), function () {
      var nodes = [];
      kids.forEach(function (k) {
        nodes.push(commentEl(k));
        var nested = repliesButton(k);
        if (nested) nodes.push(nested);
      });
      if (DATA[key].hideReplies) nodes.push(hideRepliesButton(key, nodes.slice()));
      return nodes;
    });
  }

  /** "Hide replies" collapses the thread again. Patterns must never match/click it. */
  function hideRepliesButton(key, nodes) {
    var b = document.createElement('div');
    b.setAttribute('role', 'button');
    b.setAttribute('tabindex', '0');
    b.className = 'expander depth' + depthOf(key);
    b.innerHTML = '<span>Hide replies</span>';
    b.addEventListener('click', function () {
      nodes[0].before(repliesButton(key));
      nodes.forEach(function (n) { n.remove(); });
      b.remove();
    });
    return b;
  }

  // ---- Dialog post ----------------------------------------------------------------------------
  var list = document.getElementById('comments');
  var rankOf = new WeakMap();

  /** Insert a top-level comment (and its "View N replies" button) at its rank position. */
  function insertTop(key) {
    var c = DATA[key];
    var el = commentEl(key);
    rankOf.set(el, c.rank);
    var next = Array.prototype.find.call(list.children, function (x) { return rankOf.has(x) && rankOf.get(x) > c.rank; }) || null;
    list.insertBefore(el, next);
    var rb = repliesButton(key);
    if (rb) el.after(rb);
    if (DUD_KEYS.indexOf(key) !== -1) el.after(dudButton(key));
  }

  document.querySelectorAll('.js-author-link').forEach(function (a) { a.setAttribute('href', ORIGIN + '/groups/' + SLUG + '/user/100001/?__cft__[0]=AZX&__tn__=-]C%2CP-R'); });
  document.querySelector('.js-group-link').setAttribute('href', ORIGIN + '/groups/' + SLUG + '/?__cft__[0]=AZX&__tn__=-UC%2CP-R');
  document.querySelector('.js-photo-link').setAttribute('href', ORIGIN + '/photo/?fbid=4001&set=gm.' + POST_ID + '&__cft__[0]=AZX&__tn__=EH-R');
  document.getElementById('post-photo').src = svgData(600, 340, '#b0bec5');
  // ?variant=hash: the post header's links are not filled in yet (lazy href "#").
  if (HASH) document.querySelectorAll('#post .post-header a').forEach(function (a) { a.setAttribute('href', '#'); });
  // ?variant=arialabel: the post article has an aria-label, like a comment.
  if (ARIA_LABEL) document.getElementById('post').setAttribute('aria-label', "Kyaw Zin Thant's post");

  var STORY_FIRST = P('Do you need a CS degree to become a software engineer in Myanmar? ' + E('🤔')) +
    (BODY_LINK ? P('Related: <a role="link" tabindex="0" href="' + esc(ORIGIN + '/groups/' + SLUG + '/posts/' + BODY_LINK + '/?__cft__[0]=AZX&__tn__=R]-R') + '">' +
      esc(ORIGIN + '/groups/' + SLUG + '/posts/' + BODY_LINK + '/') + '</a>') : '');
  var story = document.getElementById('story');
  story.innerHTML = STORY_FIRST +
    P('I have been working as a developer for five years and I keep hearing different opinions… ' + SEE_MORE);
  story.querySelector('.see-more').addEventListener('click', function () {
    story.innerHTML = STORY_FIRST +
      P('I have been working as a developer for five years and I keep hearing different opinions about this. Some companies here only hire graduates, others only care about your GitHub.') +
      P('What do you all think? ဘယ်လိုထင်ကြလဲ');
  });

  ['C1', 'C2', 'C3', 'C4', 'C5'].forEach(function (key) {
    if (key === 'C5' && MINUS1) return;
    insertTop(key);
  });

  document.getElementById('more-slot').appendChild(expander('View more comments', 'top', function () {
    ['C6', 'C7', 'C8'].forEach(insertTop);
    return [];
  }));

  // Lazy load when the inner scroller reaches the bottom (like Facebook's infinite comments).
  var scroller = document.getElementById('scroller');
  var sentinel = document.getElementById('sentinel');
  var lazyDone = false;
  var io = new IntersectionObserver(function (entries) {
    if (lazyDone || !entries.some(function (e) { return e.isIntersecting; })) return;
    lazyDone = true;
    io.disconnect();
    var spin = spinner();
    sentinel.before(spin);
    setTimeout(function () {
      spin.remove();
      ['C9', 'C10'].forEach(insertTop);
    }, LOAD_MS);
  }, { root: scroller, threshold: 0 });
  io.observe(sentinel);

  // ---- Sort menu ------------------------------------------------------------------------------
  var SORT_ITEMS = [
    ['Most relevant', "Show friends' comments and the most engaging comments first."],
    ['Newest', 'Show all comments with the newest comments first.'],
    ['All comments', 'Show all comments, including potential spam.']
  ];
  var sortBtn = document.getElementById('sort-btn');
  var sortLabel = document.getElementById('sort-label');
  var menu = null;
  var spamShown = false;

  function closeMenu() {
    if (!menu) return;
    menu.remove();
    menu = null;
    sortBtn.setAttribute('aria-expanded', 'false');
  }

  function choose(title) {
    closeMenu();
    sortLabel.textContent = title;
    if (title === 'All comments' && !spamShown) {
      spamShown = true;
      var spin = spinner();
      list.before(spin);
      setTimeout(function () { spin.remove(); insertTop('S1'); insertTop('S2'); }, LOAD_MS);
    }
  }

  function openMenu() {
    menu = document.createElement('div');
    menu.setAttribute('role', 'menu');
    menu.className = 'menu';
    SORT_ITEMS.forEach(function (item) {
      var mi = document.createElement('div');
      mi.setAttribute('role', 'menuitem');
      mi.setAttribute('tabindex', '-1');
      mi.className = 'menuitem';
      var title = document.createElement('div');
      title.className = 'mi-title';
      title.textContent = item[0];
      var desc = document.createElement('div');
      desc.className = 'mi-desc';
      desc.textContent = item[1];
      mi.append(title, desc);
      mi.addEventListener('click', function () { choose(item[0]); });
      menu.appendChild(mi);
    });
    document.body.appendChild(menu);
    // Keep the whole menu inside the viewport (below the button if it fits, else above).
    var r = sortBtn.getBoundingClientRect();
    var h = menu.offsetHeight;
    var top = r.bottom + 4 + h <= innerHeight - 8 ? r.bottom + 4 : Math.max(8, r.top - 4 - h);
    menu.style.left = Math.max(8, r.left) + 'px';
    menu.style.top = top + 'px';
    sortBtn.setAttribute('aria-expanded', 'true');
  }

  sortBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (menu) closeMenu(); else openMenu();
  });
  document.addEventListener('click', function (e) { if (menu && !menu.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });

  // ---- Feed behind the dialog (same post, with one preview comment) ----------------------------
  var behind = document.getElementById('behind-feed');
  var unit = document.createElement('div');
  unit.innerHTML =
    '<div role="article" aria-labelledby="_r_b1_ _r_b2_"' + (ARIA_LABEL ? ' aria-label="Kyaw Zin Thant&#39;s post"' : '') + ' class="card">' +
      '<div class="post-header">' +
        '<a role="link" tabindex="-1" aria-label="Kyaw Zin Thant" class="avatar40" href="' + esc(userUrl(100001)) + '"><svg width="40" height="40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#8a8d91"/></svg></a>' +
        '<div class="post-meta">' +
          '<div data-ad-rendering-role="profile_name"><h3 id="_r_b1_" dir="auto"><span><a role="link" tabindex="0" href="' + esc(userUrl(100001)) + '"><strong><span>Kyaw Zin Thant</span></strong></a></span></h3></div>' +
          '<div class="sub" id="_r_b2_"><span><a role="link" tabindex="0" href="' + esc(POST_URL + '?__cft__[0]=AZX&__tn__=%2CO%2CP-R') + '"><span>1w</span></a></span></div>' +
        '</div>' +
      '</div>' +
      '<div data-ad-rendering-role="story_message" class="story"><div data-ad-preview="message" data-ad-comet-preview="message">' +
        P('Do you need a CS degree to become a software engineer in Myanmar? ' + E('🤔')) + '</div></div>' +
      '<div class="post-counts">' +
        '<div data-ad-rendering-role="like_button"><div role="button" tabindex="0" aria-label="Like"><span>7</span></div></div>' +
        '<div data-ad-rendering-role="comment_button"><div role="button" tabindex="0" aria-label="Leave a comment"><span>12</span></div></div>' +
        '<div data-ad-rendering-role="share_button"><div role="button" tabindex="0" aria-label="Share"><span>3</span></div></div>' +
      '</div>' +
      '<div class="preview"></div>' +
    '</div>';
  var preview = unit.querySelector('.preview');
  preview.appendChild(commentEl('F1'));
  preview.appendChild(expander('View more comments', 'top', function () { return []; }));
  behind.appendChild(unit);

  // ---- Close (SPA): the dialog goes away and the URL returns to the group feed ------------------
  var overlay = document.querySelector('.overlay');
  document.querySelector('[role="dialog"] [aria-label="Close"]').addEventListener('click', function () {
    overlay.remove();
    document.body.classList.remove('modal-open');
    history.pushState({}, '', '/groups/' + SLUG + '/');
  });

  // ---- Timing variants ------------------------------------------------------------------------
  if (FEEDBACK_DELAY) {
    var counts = document.querySelector('#post .post-counts');
    var sortRow = document.querySelector('#post .sort-row');
    var anchor = document.getElementById('comments');
    counts.remove();
    sortRow.remove();
    setTimeout(function () { anchor.before(counts, sortRow); }, FEEDBACK_DELAY);
  }
  if (DIALOG_DELAY) {
    var chatHead = document.querySelector('.chat-head');
    overlay.remove();
    document.body.classList.remove('modal-open');
    setTimeout(function () {
      document.body.insertBefore(overlay, chatHead);
      document.body.classList.add('modal-open');
    }, DIALOG_DELAY);
  }
})();
</script>
</body>
</html>
